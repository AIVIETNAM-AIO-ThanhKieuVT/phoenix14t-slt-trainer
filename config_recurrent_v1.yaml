# =============================================================================
# Config for a SECOND, ARCHITECTURALLY-DIFFERENT back-translation evaluator
# (SLT_rnn), on top of SLT_ind (which is a different seed/depth/width of the
# SAME Transformer family as SLT_orig).
#
# This one swaps the encoder/decoder family entirely: bidirectional
# LSTM + Luong attention (classic seq2seq), vs. the self-attention
# Transformer used by SLT_orig and SLT_ind. No new model code needed —
# `RecurrentEncoder`/`RecurrentDecoder` already exist in
# back_translation/bt_encoders.py / bt_decoders.py and are selected purely
# via `type: recurrent` below (see bt_model.py build_model()).
#
# Rationale for sizing: 2-layer bidirectional LSTM, hidden=512, matches
# classical strong NMT baselines (Luong et al. 2015-style) rather than a
# deliberately small/weak RNN — avoids a reviewer counter-argument that a
# too-small evaluator is simply insensitive to overfitting.
#
# Usage (same Colab flow as SLT_ind, in the public trainer repo):
#     cd slt
#     python -m signjoey train ../configs/slt_recurrent_v1.yaml
#
# Data path expectation (same prepared pickles as SLT_ind):
#   <data_path>/phoenix14t.<train|dev|test>.pickle.gzip
# =============================================================================
name: slt_recurrent_v1
wandb: false

data:
    data_path: ../slt_data
    version: phoenix_2014_trans
    sgn: sign
    txt: text
    gls: gloss
    train: phoenix14t.train.pickle.gzip
    dev:   phoenix14t.dev.pickle.gzip
    test:  phoenix14t.test.pickle.gzip
    feature_size: 534
    skeleton_subsample: 2
    level: word
    txt_lowercase: true
    max_sent_length: 400
    random_train_subset: -1
    random_dev_subset: -1
    pose_normalization:
        low_pass_filter: false
        zero_neck: false
        norm_rotation: false

testing:
    recognition_beam_sizes:    [1, 2, 3, 4, 5]
    translation_beam_sizes:    [1, 2, 3, 4, 5]
    translation_beam_alphas:   [-1, 0, 1, 2]

training:
    reset_best_ckpt: false
    reset_scheduler: false
    reset_optimizer: false
    random_seed: 7                # third independent seed (42 orig, 142 SLT_ind)
    model_dir: ../models/slt_recurrent_v1
    recognition_loss_weight: 1.0
    translation_loss_weight: 1.0
    eval_metric: bleu
    optimizer: adam
    learning_rate: 0.001
    batch_size: 256
    num_valid_log: 5
    epochs: 3000
    early_stopping_metric: eval_metric
    batch_type: sentence
    translation_normalization: batch
    eval_recognition_beam_size: 3
    eval_translation_beam_size: 3
    eval_translation_beam_alpha: -1
    overwrite: false
    shuffle: true
    use_cuda: true
    translation_max_output_length: 30
    keep_last_ckpts: 1
    batch_multiplier: 1
    logging_freq: 100
    validation_freq: 14
    betas: [0.9, 0.998]
    scheduling: plateau
    learning_rate_min: 1.0e-08
    weight_decay: 0.001
    patience: 5
    decrease_factor: 0.8
    label_smoothing: 0.0

model:
    initializer: xavier
    bias_initializer: zeros
    init_gain: 1.0
    embed_initializer: xavier
    embed_init_gain: 1.0
    tied_softmax: false
    encoder:
        type: recurrent
        rnn_type: lstm
        bidirectional: true
        dropout: 0.2
        num_heads: 8   # unused by RecurrentEncoder itself, but SpatialEmbeddings() is built with num_heads=cfg["encoder"]["num_heads"] unconditionally in bt_model.py -- required key even for recurrent type
        embeddings:
            activation_type: softsign
            dropout: 0.1
            embedding_dim: 512
            norm_type: batch
            scale: false
        hidden_size: 512
        num_layers: 2
    decoder:
        type: recurrent
        rnn_type: lstm
        attention: luong
        input_feeding: true
        init_hidden: bridge
        dropout: 0.2
        hidden_dropout: 0.2
        num_heads: 8   # same reason: Embeddings() for target text is built with num_heads=cfg["decoder"]["num_heads"] unconditionally
        embeddings:
            activation_type: softsign
            dropout: 0.1
            embedding_dim: 512
            norm_type: batch
            scale: false
        hidden_size: 512
        num_layers: 2
