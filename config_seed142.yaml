# =============================================================================
# Config: independent SLT evaluator on PHOENIX-2014T
#   random_seed=142, encoder/decoder=4 layers, hidden=384, ff=768
# Run with: python train_slt.py --config config_seed142.yaml ...
# =============================================================================
name: slt_seed142_4layer_h384
wandb: false

data:
    data_path: ../slt_data
    version: phoenix_2014_trans
    sgn: sign
    txt: text
    gls: gloss
    train: phoenix14t.train.pickle.gzip
    dev:   phoenix14t.dev.pickle.gzip
    test:  phoenix14t.test.pickle.gzip
    feature_size: 534
    skeleton_subsample: 2
    level: word
    txt_lowercase: true
    max_sent_length: 400
    random_train_subset: -1
    random_dev_subset: -1
    pose_normalization:
        low_pass_filter: false
        zero_neck: false
        norm_rotation: false

testing:
    recognition_beam_sizes:    [1, 2, 3, 4, 5]
    translation_beam_sizes:    [1, 2, 3, 4, 5]
    translation_beam_alphas:   [-1, 0, 1, 2]

training:
    reset_best_ckpt: false
    reset_scheduler: false
    reset_optimizer: false
    random_seed: 142             # CHANGED: 42 -> 142 for independence
    model_dir: ../models/slt_v2_seed142_4layer_h384
    recognition_loss_weight: 1.0
    translation_loss_weight: 1.0
    eval_metric: bleu
    optimizer: adam
    learning_rate: 0.001
    batch_size: 32
    num_valid_log: 5
    epochs: 3000
    early_stopping_metric: eval_metric
    batch_type: sentence
    translation_normalization: batch
    eval_recognition_beam_size: 3
    eval_translation_beam_size: 3
    eval_translation_beam_alpha: -1
    overwrite: false
    shuffle: true
    use_cuda: true
    translation_max_output_length: 30
    keep_last_ckpts: 1
    batch_multiplier: 8
    logging_freq: 100
    validation_freq: 14
    betas: [0.9, 0.998]
    scheduling: plateau
    learning_rate_min: 1.0e-08
    weight_decay: 0.001
    patience: 5
    decrease_factor: 0.8
    label_smoothing: 0.0

model:
    initializer: xavier
    bias_initializer: zeros
    init_gain: 1.0
    embed_initializer: xavier
    embed_init_gain: 1.0
    tied_softmax: false
    encoder:
        dropout: 0.1
        embeddings:
            activation_type: softsign
            dropout: 0.1
            embedding_dim: 384       # CHANGED: 256 -> 384
            norm_type: batch
            scale: false
        ff_size: 768                  # CHANGED: 512 -> 768  (= 2 * hidden)
        hidden_size: 384              # CHANGED: 256 -> 384
        num_heads: 8
        num_layers: 4                 # CHANGED: 3 -> 4
        type: transformer
    decoder:
        dropout: 0.1
        embeddings:
            activation_type: softsign
            dropout: 0.1
            embedding_dim: 384        # CHANGED: 256 -> 384
            norm_type: batch
            scale: false
        ff_size: 768                  # CHANGED: 512 -> 768
        hidden_size: 384              # CHANGED: 256 -> 384
        num_heads: 8
        num_layers: 4                 # CHANGED: 3 -> 4
        type: transformer
